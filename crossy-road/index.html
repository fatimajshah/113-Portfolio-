<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Crossy Road MVP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ─── Constants ───────────────────────────────────────────────────────────────
const TILE_W = 64;   // isometric tile width
const TILE_H = 32;   // isometric tile height
const TILE_DEPTH = 14; // voxel side depth
const WORLD_COLS = 11; // tiles per row (col 0–10)
const CENTER_COL = 5;
const LANES_AHEAD = 18;
const LANES_BEHIND = 6;

// ─── Canvas setup ────────────────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

// ─── Isometric helpers ───────────────────────────────────────────────────────
function isoProject(col, row, cameraRow) {
  const offsetRow = row - cameraRow;
  const sx = canvas.width  / 2 + (col - CENTER_COL) * TILE_W / 2 + offsetRow * TILE_W / 2;
  const sy = canvas.height * 0.65 + (col - CENTER_COL) * TILE_H / 2 - offsetRow * TILE_H / 2;
  return { sx, sy };
}

function drawVoxel(col, row, cameraRow, topColor, leftColor, rightColor, h = 1, raised = false) {
  let { sx, sy } = isoProject(col, row, cameraRow);
  const hw = TILE_W / 2;
  const hh = TILE_H / 2;
  const depth = TILE_DEPTH * h;
  if (raised) sy -= depth;

  ctx.beginPath();
  ctx.moveTo(sx,      sy);
  ctx.lineTo(sx + hw, sy + hh);
  ctx.lineTo(sx,      sy + TILE_H);
  ctx.lineTo(sx - hw, sy + hh);
  ctx.closePath();
  ctx.fillStyle = topColor;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(sx - hw, sy + hh);
  ctx.lineTo(sx,      sy + TILE_H);
  ctx.lineTo(sx,      sy + TILE_H + depth);
  ctx.lineTo(sx - hw, sy + hh + depth);
  ctx.closePath();
  ctx.fillStyle = leftColor;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(sx + hw, sy + hh);
  ctx.lineTo(sx,      sy + TILE_H);
  ctx.lineTo(sx,      sy + TILE_H + depth);
  ctx.lineTo(sx + hw, sy + hh + depth);
  ctx.closePath();
  ctx.fillStyle = rightColor;
  ctx.fill();
}

// Draw each vehicle as one raised body with a cabin and visible wheels.
function drawCar(col, row, span) {
  const { sx, sy } = isoProject(col, row, camera.row);
  const colors = ['#e74c3c', '#e67e22', '#f1c40f', '#3498db', '#9b59b6'];
  const color = colors[Math.abs(row * 7 + 3) % colors.length];
  function face(points, fill) {
    ctx.beginPath();
    points.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
  }
  function box(x, y, length, width, height, top, left, right) {
    const a = [x, y - height];
    const b = [x + length * 32, y + length * 16 - height];
    const c = [b[0] - width * 32, b[1] + width * 16];
    const d = [x - width * 32, y + width * 16 - height];
    face([d, c, [c[0], c[1] + height], [d[0], d[1] + height]], left);
    face([b, c, [c[0], c[1] + height], [b[0], b[1] + height]], right);
    face([a, b, c, d], top);
  }
  box(sx, sy - 4, span, 0.85, 18, color, '#873126', '#ac392b');
  for (const t of [0.2, span - 0.2]) {
    ctx.beginPath();
    ctx.ellipse(sx + t * 32 - 27, sy + t * 16 + 9, 5, 7, -0.35, 0, Math.PI * 2);
    ctx.fillStyle = '#20232a';
    ctx.fill();
  }
  box(sx + 5, sy - 20, Math.max(0.4, span - 0.45), 0.6, 13,
      color, '#a8d8eb', '#69accb');
}

// ─── World generation ────────────────────────────────────────────────────────
const lanes = {};
let highestGeneratedRow = 0;

function generateLane(row) {
  if (row <= 2) {
    lanes[row] = { type: 'grass', cars: [] };
    return;
  }

  let consecutiveRoad = 0;
  for (let r = row - 1; r >= row - 3 && r >= 0; r--) {
    if (lanes[r] && lanes[r].type === 'road') consecutiveRoad++;
    else break;
  }

  const forceGrass = consecutiveRoad >= 3;
  const type = forceGrass ? 'grass' : (Math.random() < 0.5 ? 'road' : 'grass');

  if (type === 'grass') {
    lanes[row] = { type: 'grass', cars: [] };
  } else {
    const speed = 2 + Math.random() * 4;
    const dir = Math.random() < 0.5 ? 1 : -1;
    const spawnInterval = 1.5 + Math.random() * 2;
    lanes[row] = {
      type: 'road',
      cars: [],
      carSpeed: speed,
      carDir: dir,
      nextSpawn: 0,
      spawnInterval,
    };
  }
}

function ensureLanesGenerated(chickenRow) {
  const targetAhead = chickenRow + LANES_AHEAD;
  while (highestGeneratedRow < targetAhead) {
    highestGeneratedRow++;
    generateLane(highestGeneratedRow);
  }
  for (const key of Object.keys(lanes)) {
    if (Number(key) < chickenRow - LANES_BEHIND - 5) delete lanes[key];
  }
}

// ─── Cars ────────────────────────────────────────────────────────────────────
function spawnCar(lane) {
  const span = Math.random() < 0.3 ? 2 : 1;
  const startCol = lane.carDir === 1 ? -span : WORLD_COLS;
  lane.cars.push({ col: startCol, span });
}

function updateCars(dt) {
  for (const key of Object.keys(lanes)) {
    const lane = lanes[key];
    if (lane.type !== 'road') continue;

    lane.nextSpawn -= dt;
    if (lane.nextSpawn <= 0) {
      spawnCar(lane);
      lane.nextSpawn = lane.spawnInterval;
    }

    for (const car of lane.cars) {
      car.col += lane.carSpeed * lane.carDir * dt;
    }

    lane.cars = lane.cars.filter(car =>
      lane.carDir === 1 ? car.col < WORLD_COLS + 2 : car.col > -4
    );
  }
}

// ─── Chicken ─────────────────────────────────────────────────────────────────
let chicken = {
  col: CENTER_COL,
  row: 0,
  animating: false,
  animFrom: null,
  animTo: null,
  animT: 0,
  animDur: 0.18,
  renderCol: CENTER_COL,
  renderRow: 0,
  dead: false,
};

function tryHop(dc, dr) {
  if (chicken.animating || chicken.dead) return;
  const newCol = chicken.col + dc;
  const newRow = chicken.row + dr;
  if (newCol < 0 || newCol >= WORLD_COLS) return;
  if (newRow < camera.row - LANES_BEHIND) return;
  chicken.animating = true;
  chicken.animFrom = { col: chicken.col, row: chicken.row };
  chicken.animTo   = { col: newCol, row: newRow };
  chicken.animT = 0;
}

function updateChicken(dt) {
  if (!chicken.animating) return;
  chicken.animT += dt / chicken.animDur;

  if (chicken.animT >= 1) {
    chicken.animT = 1;
    chicken.col = chicken.animTo.col;
    chicken.row = chicken.animTo.row;
    chicken.renderCol = chicken.col;
    chicken.renderRow = chicken.row;
    chicken.animating = false;

    if (chicken.row > score) {
      score = chicken.row;
      if (score > highScore) highScore = score;
      camera.targetRow = Math.max(camera.targetRow, chicken.row - 2);
    }
  } else {
    const t = chicken.animT;
    chicken.renderCol = chicken.animFrom.col + (chicken.animTo.col - chicken.animFrom.col) * t;
    chicken.renderRow = chicken.animFrom.row + (chicken.animTo.row - chicken.animFrom.row) * t;
  }
}

// ─── Camera ──────────────────────────────────────────────────────────────────
const camera = { row: 0, targetRow: 0 };

function updateCamera(dt) {
  const diff = camera.targetRow - camera.row;
  camera.row += diff * Math.min(1, dt * 8);
}

// ─── Collision detection ─────────────────────────────────────────────────────
function checkCollisions() {
  if (chicken.animating || chicken.dead) return;
  const lane = lanes[chicken.row];
  if (!lane) return;
  if (lane.type !== 'road') return;
  for (const car of lane.cars) {
    if (chicken.col >= car.col && chicken.col < car.col + car.span) {
      triggerDeath();
      return;
    }
  }
}

// ─── Death ───────────────────────────────────────────────────────────────────
let gameState = 'playing';
let score = 0;
let highScore = 0;
let deathTimer = 0;

function triggerDeath() {
  if (chicken.dead) return;
  chicken.dead = true;
  gameState = 'dead';
  deathTimer = 1.2;
}

function resetGame() {
  chicken = {
    col: CENTER_COL,
    row: 0,
    animating: false,
    animFrom: null,
    animTo: null,
    animT: 0,
    animDur: 0.18,
    renderCol: CENTER_COL,
    renderRow: 0,
    dead: false,
  };
  score = 0;
  gameState = 'playing';
  camera.row = 0;
  camera.targetRow = 0;
  for (const k of Object.keys(lanes)) delete lanes[k];
  highestGeneratedRow = 0;
  ensureLanesGenerated(0);
}

// ─── Input ───────────────────────────────────────────────────────────────────
let pendingInput = null;

window.addEventListener('keydown', e => {
  if (e.repeat) return;

  if (gameState === 'dead') {
    resetGame();
    return;
  }

  const map = {
    ArrowUp: [0, 1], w: [0, 1], W: [0, 1],
    ArrowDown: [0, -1], s: [0, -1], S: [0, -1],
    ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0], D: [1, 0],
  };

  const dir = map[e.key];
  if (!dir) return;
  e.preventDefault();

  if (!chicken.animating) {
    tryHop(dir[0], dir[1]);
  } else {
    pendingInput = dir;
  }
});

// ─── Rendering ───────────────────────────────────────────────────────────────
function drawLanes() {
  const visStart = Math.floor(camera.row) - LANES_BEHIND;
  const visEnd   = Math.floor(camera.row) + LANES_AHEAD;

  const drawCalls = [];

  for (let row = visStart; row <= visEnd; row++) {
    const lane = lanes[row];
    if (!lane) continue;
    const isRoad = lane.type === 'road';

    for (let col = 0; col < WORLD_COLS; col++) {
      drawCalls.push({ type: 'tile', col, row, isRoad });
    }

    if (isRoad) {
      for (const car of lane.cars) {
        drawCalls.push({ type: 'car', col: car.col, row, span: car.span });
      }
    }
  }

  drawCalls.push({ type: 'chicken', col: chicken.renderCol, row: chicken.renderRow });

  // Ground is a complete first pass, so no tile can cover a raised object.
  // Within each pass, paint from the farthest screen depth to the nearest.
  drawCalls.sort((a, b) => {
    const layerA = a.type === 'tile' ? 0 : 1;
    const layerB = b.type === 'tile' ? 0 : 1;
    return layerA - layerB || (a.col - a.row) - (b.col - b.row);
  });

  for (const dc of drawCalls) {
    if (dc.type === 'tile') {
      if (dc.isRoad) {
        drawVoxel(dc.col, dc.row, camera.row, '#555', '#333', '#444');
      } else {
        drawVoxel(dc.col, dc.row, camera.row, '#4a7c3f', '#2d5a27', '#3a6b32');
      }
    } else if (dc.type === 'car') {
      drawCar(dc.col, dc.row, dc.span);
    } else if (dc.type === 'chicken') {
      drawVoxel(dc.col, dc.row, camera.row, '#f1c40f', '#b7950b', '#d4ac0d', 1.4, true);
      const { sx, sy } = isoProject(dc.col, dc.row, camera.row);
      ctx.beginPath();
      ctx.arc(sx, sy - TILE_DEPTH * 1.4 - 6, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#f1c40f';
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(sx + 6,  sy - TILE_DEPTH * 1.4 - 6);
      ctx.lineTo(sx + 14, sy - TILE_DEPTH * 1.4 - 4);
      ctx.lineTo(sx + 6,  sy - TILE_DEPTH * 1.4 - 2);
      ctx.closePath();
      ctx.fillStyle = '#e67e22';
      ctx.fill();
    }
  }
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0, 0, canvas.width, 54);
  ctx.font = 'bold 26px monospace';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.fillText(`Score: ${score}`, canvas.width / 2, 36);
  ctx.font = '16px monospace';
  ctx.fillStyle = '#aaa';
  ctx.fillText(`Best: ${highScore}`, canvas.width / 2 + 120, 36);
  ctx.font = '13px monospace';
  ctx.fillStyle = '#888';
  ctx.textAlign = 'left';
  ctx.fillText('↑ W   ↓ S   ← A   → D', 14, 36);
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.textAlign = 'center';
  ctx.font = 'bold 52px monospace';
  ctx.fillStyle = '#e74c3c';
  ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 40);
  ctx.font = '28px monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 10);
  if (score >= highScore && score > 0) {
    ctx.font = '20px monospace';
    ctx.fillStyle = '#f1c40f';
    ctx.fillText('🏆 New Best!', canvas.width / 2, canvas.height / 2 + 44);
  }
  ctx.font = '18px monospace';
  ctx.fillStyle = '#aaa';
  ctx.fillText('Press any arrow key or WASD to restart', canvas.width / 2, canvas.height / 2 + 88);
}

// ─── Game loop ───────────────────────────────────────────────────────────────
let lastTime = null;

function loop(ts) {
  if (!lastTime) lastTime = ts;
  const dt = Math.min((ts - lastTime) / 1000, 0.1);
  lastTime = ts;

  ensureLanesGenerated(chicken.row);

  if (gameState === 'playing') {
    updateCars(dt);
    updateChicken(dt);
    checkCollisions();
    updateCamera(dt);

    if (!chicken.animating && pendingInput) {
      tryHop(pendingInput[0], pendingInput[1]);
      pendingInput = null;
    }

    if (chicken.row < camera.row - LANES_BEHIND + 1) {
      triggerDeath();
    }
  } else if (gameState === 'dead') {
    deathTimer -= dt;
    updateCamera(dt);
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#1a1a2e');
  grad.addColorStop(1, '#16213e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawLanes();
  drawHUD();

  if (gameState === 'dead') drawGameOver();

  requestAnimationFrame(loop);
}

// ─── Boot ────────────────────────────────────────────────────────────────────
ensureLanesGenerated(0);
requestAnimationFrame(loop);
</script>
</body>
</html>
